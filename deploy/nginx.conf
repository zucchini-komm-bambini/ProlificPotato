# Auslieferung von docs/ mit dem offiziellen Docker-Image nginx:alpine.
# Einbinden als /etc/nginx/conf.d/default.conf (ersetzt die Standardseite).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Nach einem Update keine Dateien verschiedener Versionen mischen:
    # Der Browser fragt bei jedem Laden kurz nach (304, wenn unverändert).
    add_header Cache-Control "no-cache" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript application/wasm
               application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
    }
}
